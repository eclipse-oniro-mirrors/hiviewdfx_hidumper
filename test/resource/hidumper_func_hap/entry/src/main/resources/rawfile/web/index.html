<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hidumper arkweb target</title>
</head>
<body>
  <h3>ArkWeb render target active</h3>
  <p>This page keeps the render-process JS heap populated for
     hidumper --mem-heap --arkweb-js verification.</p>
  <script>
    window.__arkwebBallast = [];
    setInterval(function () {
      for (var i = 0; i < 16; i++) {
        window.__arkwebBallast.push({ t: Date.now(), pad: 'arkweb-render-heap-ballast-payload' });
      }
      if (window.__arkwebBallast.length > 4096) {
        window.__arkwebBallast.splice(0, 2048);
      }
      document.title = 'ballast=' + window.__arkwebBallast.length;
    }, 100);
  </script>
</body>
</html>
